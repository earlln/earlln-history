name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 원고 → history.json (깨진 링크·중복 id 가 있으면 여기서 실패)
      - name: Build content
        run: python tools/build_content.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name APK by version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "EarllnHistory-v$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EarllnHistory-apk
          path: EarllnHistory-v*.apk

      # versionName 마다 릴리스 하나. 같은 버전이면 APK 만 바꿔 올린다.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "EarllnHistory-v$VER.apk" --clobber
          else
            gh release create "$TAG" "EarllnHistory-v$VER.apk" \
              --target "$GITHUB_SHA" \
              --title "Earlln History v$VER" \
              --notes "한국사 · 세계사 핵심 요약 앱. 아래 APK 를 휴대폰에서 내려받아 설치하세요 (출처를 알 수 없는 앱 설치 허용 필요)."
          fi
